# GoReleaser config — cross-platform release binaries + a Homebrew tap.
# Cut a release: tag the commit (git tag v0.1.0 && git push --tags) then
# `make release` (or `goreleaser release --clean`). Local dry run: `make snapshot`.
version: 2

project_name: nt

before:
  hooks:
    - go mod tidy
    # Build the SPA so the released binary embeds it via //go:embed. The bundle
    # (internal/web/frontend/dist) is generated here, not committed, so this hook
    # is required — without it the release would ship with no web UI.
    - npm --prefix internal/web/frontend ci
    - npm --prefix internal/web/frontend run build

builds:
  - id: nt
    main: .
    binary: nt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: nt
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Windows users expect a .zip; everything else stays .tar.gz.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  # Build the changelog from the local git log, not GitHub's compare API. The
  # compare endpoint 404s when a prior tag has been deleted from the remote
  # (as happened with v0.16.1–v0.16.4), failing the whole release.
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# Homebrew tap: navbytes/homebrew-tap, pushed to on every release via
# HOMEBREW_TAP_GITHUB_TOKEN (a fine-grained PAT scoped to that repo's
# Contents: read/write — see RELEASING.md). homebrew_casks, not the
# deprecated brews (fully removed in GoReleaser v2.16, May 2026) — casks are
# the supported format for precompiled binaries; name/binary default to
# project_name ("nt") by convention, same as GoReleaser's own cask config.
homebrew_casks:
  - repository:
      owner: navbytes
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/navbytes/nt"
    description: "Terminal task & note manager — durable memory for AI coding sessions"
    license: MIT
