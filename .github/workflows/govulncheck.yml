name: Vulncheck

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 9 * * 1" # weekly, to catch newly-disclosed CVEs in deps

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Install + run govulncheck directly instead of golang/govulncheck-action,
      # whose internal git checkout was failing in CI with "unable to access … 400"
      # (git exit 128) on every run. This direct invocation is what we run locally
      # and only fails the build when a vulnerability actually reaches our code.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
      # desktop/ is a separate module and `./...` from the root does not reach
      # it (`go list ./...` returns zero desktop packages there). Scanned
      # without Wails build tags, same as ci.yml's compile step — that covers
      # the dependency graph, which is what this check is about.
      - name: Run govulncheck (desktop module)
        working-directory: desktop
        run: govulncheck ./...
