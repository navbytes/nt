name: Vulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # weekly, to catch newly-disclosed CVEs in deps

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Install + run govulncheck directly instead of golang/govulncheck-action,
      # whose internal git checkout was failing in CI with "unable to access … 400"
      # (git exit 128) on every run. This direct invocation is what we run locally
      # and only fails the build when a vulnerability actually reaches our code.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
      # desktop/ is a separate module and `./...` from the root does not reach
      # it (`go list ./...` returns zero desktop packages there). Scanned
      # without Wails build tags, same as ci.yml's compile step — that covers
      # the dependency graph, which is what this check is about.
      - name: Run govulncheck (desktop module)
        working-directory: desktop
        run: govulncheck ./...
