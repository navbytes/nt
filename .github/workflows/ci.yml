name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          endpoint="repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          gh api "$endpoint" > "$RUNNER_TEMP/pr-before.json"
          if ! jq -e --arg head "$PR_HEAD" --arg base "$PR_BASE" '.head.sha == $head and .base.sha == $base' "$RUNNER_TEMP/pr-before.json" >/dev/null; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          total=$(jq -er '.changed_files' "$RUNNER_TEMP/pr-before.json")
          gh api --paginate --slurp "$endpoint/files" > "$RUNNER_TEMP/changed-files.json"
          gh api "$endpoint" > "$RUNNER_TEMP/pr-after.json"
          if ! jq -e --arg head "$PR_HEAD" --arg base "$PR_BASE" '.head.sha == $head and .base.sha == $base' "$RUNNER_TEMP/pr-after.json" >/dev/null; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          value=$(jq --argjson total "$total" 'add | if length == 0 or length != $total then true else any(.[]; ([.filename, (.previous_filename // .filename)] | any(.[]; test("^(docs/.*\\.md|[^/]+\\.md|LICENSE)$") | not))) end' "$RUNNER_TEMP/changed-files.json")
          echo "code=$value" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Verify generated API types are fresh (tygo)
        run: |
          go run github.com/gzuidhof/tygo@v0.2.21 generate
          if ! git diff --quiet -- internal/web/frontend/src/lib/api-types.ts; then
            echo "::error::api-types.ts is stale — run 'make web-types' and commit the result."
            git diff -- internal/web/frontend/src/lib/api-types.ts
            exit 1
          fi
      # The desktop shell is a nested module — invisible to the parent's ./... —
      # so without this only release tags would catch a break. The no-tags stub
      # path type-checks main.go without needing WebKit/GTK on the runner.
      - name: Compile the desktop module
        run: cd desktop && go build ./...

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # Run on Linux (case-sensitive) AND macOS (case-insensitive). The macOS leg
    # catches case-only filename collisions — e.g. a Foo.svelte component next to
    # a foo.svelte.ts runes module — which resolve fine on Linux but break
    # svelte-check on macOS/Windows dev machines and release runners.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: internal/web/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/web/frontend/package-lock.json
      - run: npm ci
      - name: svelte-check (type errors fail; warnings don't)
        run: npm run check
      - name: vitest
        run: npm test

  result:
    name: ${{ github.workflow }} result
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [changes, test, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['changes']['result'] == 'success', 'Change detection did not succeed'
          assert all(job['result'] in ('success', 'skipped') for job in results.values()), results
          PYTHON
